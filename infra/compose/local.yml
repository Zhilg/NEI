name: idp

services:
  worker:
    image: ${IDP_APP_IMAGE:-local/idp-app:latest}
    pull_policy: never
    command: ["idp"]

    environment:
      PYTHONPATH: /workspace/src

      IDP_INPUT_ROOT: /input
      IDP_OUTPUT_ROOT: /output
      IDP_MODELS_ROOT: /models

      IDP_VL_ENDPOINTS: ${IDP_VL_ENDPOINTS:-http://vllm-vl:8000/v1}
      IDP_VL_MODEL: ${IDP_VL_MODEL:-Qwen2.5-VL-32B-Instruct-AWQ}

      IDP_TEXT_LLM_ENDPOINT: ${IDP_TEXT_LLM_ENDPOINT:-}
      IDP_TEXT_LLM_MODEL: ${IDP_TEXT_LLM_MODEL:-}

      IDP_VL_CONCURRENCY: ${IDP_VL_CONCURRENCY:-8}

    volumes:
      - ${IDP_SOURCE_ROOT:-../..}:/workspace:ro
      - ${IDP_INPUT_ROOT:-../../data/input}:/input:ro
      - ${IDP_OUTPUT_ROOT:-../../data/output}:/output

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_WORKER_GPU:-0}"]
              capabilities: [gpu]

    depends_on:
      vllm-vl:
        condition: service_healthy

  vllm-vl:
    image: ${IDP_VLLM_VL_IMAGE:-local/vllm-vl:latest}
    pull_policy: never
    restart: unless-stopped
    deploy:
      replicas: ${IDP_VLLM_REPLICAS:-1}
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU:-0}"]
              capabilities: [gpu]

    command:
      - --model
      - /models/vl
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen2.5-VL-32B-Instruct-AWQ}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --quantization
      - "awq"
      - --dtype
      - "half"
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "50000"
      - --trust-remote-code

    environment:
      HF_HOME: /models/vl/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"

    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s

  text-llm:
    profiles: ["text-llm"]
    image: ${IDP_TEXT_LLM_IMAGE:-local/vllm-vl:latest}
    pull_policy: never
    restart: unless-stopped

    command:
      - --model
      - /models/text
      - --served-model-name
      - ${IDP_TEXT_LLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.3}
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --trust-remote-code
      - --dtype
      - "half"
      - --gpu-memory-utilization
      - "0.9"

    environment:
      HF_HOME: /models/text/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"

    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_TEXT_LLM_GPU:-1}"]
              capabilities: [gpu]

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s

networks:
  idp_internal:
    internal: true
