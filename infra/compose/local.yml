services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: idp
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: idp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idp -d idp"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      until mc alias set local http://minio:9000 minioadmin minioadmin;
      do sleep 1; done;
      mc mb --ignore-existing local/idp-artifacts
    depends_on:
      minio:
        condition: service_started

  migrate:
    build:
      context: ../..
    command: ["alembic", "upgrade", "head"]
    environment:
      IDP_DATABASE_URL: postgresql+psycopg://idp:idp@postgres:5432/idp
    depends_on:
      postgres:
        condition: service_healthy

  controller:
    build:
      context: ../..
    command: ["idp", "controller", "run"]
    environment:
      IDP_DATABASE_URL: postgresql+psycopg://idp:idp@postgres:5432/idp
      IDP_MINIO_ENDPOINT: minio:9000
      IDP_MINIO_ACCESS_KEY: minioadmin
      IDP_MINIO_SECRET_KEY: minioadmin
      IDP_OFFLINE_MODE: "true"
      IDP_TELEMETRY_ENABLED: "false"
      IDP_METRICS_PORT: "9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "9100:9100"

  worker:
    build:
      context: ../..
    command: ["idp", "worker", "run"]
    environment:
      IDP_DATABASE_URL: postgresql+psycopg://idp:idp@postgres:5432/idp
      IDP_MINIO_ENDPOINT: minio:9000
      IDP_MINIO_ACCESS_KEY: minioadmin
      IDP_MINIO_SECRET_KEY: minioadmin
      IDP_OFFLINE_MODE: "true"
      IDP_TELEMETRY_ENABLED: "false"
      IDP_METRICS_PORT: "9101"
      IDP_MINERU_COMMAND: ${IDP_MINERU_COMMAND:?Set pinned MinerU command JSON}
      IDP_OCR_DETECTOR_COMMAND: ${IDP_OCR_DETECTOR_COMMAND:?Set pinned detector command JSON}
      IDP_OCR_ROUTER_COMMAND: ${IDP_OCR_ROUTER_COMMAND:?Set pinned router command JSON}
      IDP_OCR_EAST_SLAVIC_COMMAND: ${IDP_OCR_EAST_SLAVIC_COMMAND:?Set pinned East-Slavic recognizer command JSON}
      IDP_OCR_CYRILLIC_COMMAND: ${IDP_OCR_CYRILLIC_COMMAND:?Set pinned Cyrillic recognizer command JSON}
      IDP_OCR_LATIN_CJK_COMMAND: ${IDP_OCR_LATIN_CJK_COMMAND:?Set pinned Latin/CJK recognizer command JSON}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      qwen-vl:
        condition: service_started
      qwen3:
        condition: service_started
    ports:
      - "9101:9101"

  # Optional local OpenAI-compatible endpoints. Target images are always pinned by digest.
  qwen-vl:
    image: ${IDP_QWEN_VL_IMAGE:?Set a pinned local vLLM image digest}
    command: ${IDP_QWEN_VL_COMMAND:-serve Qwen/Qwen2.5-VL-32B-Instruct}
    environment:
      CUDA_VISIBLE_DEVICES: "0"
    gpus: all

  qwen3:
    image: ${IDP_QWEN3_IMAGE:?Set a pinned local vLLM image digest}
    command: ${IDP_QWEN3_COMMAND:-serve Qwen/Qwen3-14B}
    environment:
      CUDA_VISIBLE_DEVICES: "0"
    gpus: all
