[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "offline-pdf-batch-pipeline"
version = "0.1.0"
description = "Air-gapped PDF batch-processing pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pymupdf>=1.26,<1.27",
  "pillow>=11.2,<12",
  "mammoth>=1.8,<2",
  "tqdm>=4.67,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = []

[project.scripts]
idp = "idp.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idp"]
