name: idp

services:
  # Keep GPU reservation in compose but avoid passing device flags that confuse vllm.

  vllm-vl:
    environment:
      # Hide GPU from the container; use a CPU-friendly vllm image instead.
      CUDA_VISIBLE_DEVICES: ""

  vllm-llm:
    environment:
      CUDA_VISIBLE_DEVICES: ""

networks:
  idp_internal:
    internal: true
