groups:
  - name: idp-controller
    rules:
      - alert: IdpLeaseRecoverySpike
        expr: increase(idp_leases_recovered_total[15m]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Repeated worker lease recovery detected
      - alert: IdpCapacityPaused
        expr: idp_batches_paused_capacity > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Batch processing paused because a bounded resource is unavailable
      - alert: IdpQueueBacklog
        expr: sum(idp_queue_depth{state="pending"}) > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Durable pipeline queue backlog is sustained
      - alert: IdpRetrySpike
        expr: sum(increase(idp_stage_retries_total[15m])) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Pipeline stage retries are elevated
      - alert: IdpQuarantineSpike
        expr: sum(increase(idp_items_quarantined_total[15m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Multiple batch items were quarantined
