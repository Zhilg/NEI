name: idp

services:
  worker:
    image: ${IDP_APP_IMAGE:-local/idp-app:latest}
    pull_policy: never
    command: ["idp"]
    environment:
      PYTHONPATH: /workspace/src
      IDP_INPUT_ROOT: /input
      IDP_OUTPUT_ROOT: /output
      IDP_MODELS_ROOT: /models
      IDP_VL_ENDPOINT: http://vllm-vl:8000/v1
      IDP_LLM_ENDPOINT: http://vllm-llm:8000/v1
      IDP_VL_MODEL: ${IDP_VL_MODEL:-Qwen2.5-VL-32B-Instruct}
      IDP_LLM_MODEL: ${IDP_LLM_MODEL:-Qwen3-14B-Instruct}
    volumes:
      - ${IDP_SOURCE_ROOT:-../..}:/workspace:ro
      - ${IDP_INPUT_ROOT:-../../data/input}:/input:ro
      - ${IDP_OUTPUT_ROOT:-../../data/output}:/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_WORKER_GPU:-0}"]
              capabilities: [gpu]
    depends_on:
      vllm-vl:
        condition: service_healthy
      vllm-llm:
        condition: service_healthy
    profiles: [linux]

  worker-win:
    image: ${IDP_APP_IMAGE:-local/idp-app:latest}
    pull_policy: never
    command: ["idp"]
    environment:
      PYTHONPATH: /workspace/src
      IDP_INPUT_ROOT: /input
      IDP_OUTPUT_ROOT: /output
      IDP_MODELS_ROOT: /models
      IDP_VL_ENDPOINT: http://vllm-win-vl:8000/v1
      IDP_LLM_ENDPOINT: http://vllm-win-llm:8000/v1
      IDP_VL_MODEL: ${IDP_VL_MODEL:-Qwen2-VL-2B-Instruct}
      IDP_LLM_MODEL: ${IDP_LLM_MODEL:-Qwen2.5-0.5B-Instruct}
    volumes:
      - ${IDP_SOURCE_ROOT:-../..}:/workspace:ro
      - ${IDP_INPUT_ROOT:-../../data/input}:/input:ro
      - ${IDP_OUTPUT_ROOT:-../../data/output}:/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_WORKER_GPU:-0}"]
              capabilities: [gpu]
    depends_on:
      vllm-win-vl:
        condition: service_healthy
      vllm-win-llm:
        condition: service_healthy
    profiles: [win-test]

  vllm-vl:
    image: ${IDP_VLLM_VL_IMAGE:-local/vllm-vl:latest}
    pull_policy: never
    restart: unless-stopped
    command:
      - --model
      - /models/vl
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen2.5-VL-32B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.95"
      - --max-model-len
      - "32768"
      - --quantization
      - awq
    environment:
      CUDA_VISIBLE_DEVICES: ${IDP_VLLM_VL_GPU:-0}
      HF_HOME: /models/vl/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU:-0}"]
              capabilities: [gpu]
    profiles: [linux]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  vllm-llm:
    image: ${IDP_VLLM_LLM_IMAGE:-local/vllm-llm:latest}
    pull_policy: never
    restart: unless-stopped
    command:
      - --model
      - /models/llm
      - --served-model-name
      - ${IDP_LLM_MODEL:-Qwen3-14B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.95"
      - --max-model-len
      - "32768"
      - --quantization
      - awq
    environment:
      CUDA_VISIBLE_DEVICES: ${IDP_VLLM_LLM_GPU:-0}
      HF_HOME: /models/llm/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_LLM_GPU:-0}"]
              capabilities: [gpu]
    profiles: [linux]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  vllm-win-vl:
    image: ${IDP_VLLM_WIN_VL_IMAGE:-local/vllm-win-vl:latest}
    pull_policy: never
    restart: unless-stopped
    command:
      - --model
      - /models
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen2-VL-2B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.75"
      - --max-model-len
      - "2048"
      - --dtype
      - half
    environment:
      CUDA_VISIBLE_DEVICES: ${IDP_VLLM_VL_GPU:-0}
      VLLM_NO_USAGE_STATS: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU:-0}"]
              capabilities: [gpu]
    profiles: [win-test]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  vllm-win-llm:
    image: ${IDP_VLLM_WIN_LLM_IMAGE:-local/vllm-win-llm:latest}
    pull_policy: never
    restart: unless-stopped
    command:
      - --model
      - /models
      - --served-model-name
      - ${IDP_LLM_MODEL:-Qwen2.5-0.5B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.75"
      - --max-model-len
      - "2048"
      - --dtype
      - half
    environment:
      CUDA_VISIBLE_DEVICES: ${IDP_VLLM_LLM_GPU:-0}
      VLLM_NO_USAGE_STATS: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_LLM_GPU:-0}"]
              capabilities: [gpu]
    profiles: [win-test]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

networks:
  idp_internal:
    internal: true
