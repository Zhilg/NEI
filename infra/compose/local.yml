name: idp

services:
  web:
    image: ${IDP_APP_IMAGE:-local/idp-app:latest}
    pull_policy: never
    build:
      context: ${IDP_SOURCE_ROOT:-../../}
      dockerfile: Dockerfile
    command: ["idp-web", "--root", "/data/ui", "--host", "0.0.0.0", "--port", "8067", "--stub"]
    environment:
      PYTHONPATH: /workspace/src
      IDP_VL_MODEL: stub-vl
      IDP_RECONSTRUCT_FORMATS: ${IDP_RECONSTRUCT_FORMATS:-docx,pdf}
      IDP_VISIO_MODE: ${IDP_VISIO_MODE:-false}
      IDP_VISIO_CONTENT: ${IDP_VISIO_CONTENT:-pages}
    ports:
      - "8067:8067"
    volumes:
      - ${IDP_SOURCE_ROOT:-../..}:/workspace:ro
      - ui_data:/data/ui
    restart: unless-stopped

volumes:
  ui_data:

networks:
  idp_internal:
    internal: true
