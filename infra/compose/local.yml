name: idp

services:
  worker:
    image: ${IDP_APP_IMAGE:-local/idp-app:latest}
    pull_policy: never
    command: ["idp"]
    environment:
      PYTHONPATH: /workspace/src
      IDP_INPUT_ROOT: /input
      IDP_OUTPUT_ROOT: /output
      IDP_MODELS_ROOT: /models
    volumes:
      - ${IDP_SOURCE_ROOT:-../..}:/workspace:ro
      - ${IDP_INPUT_ROOT:-../../data/input}:/input:ro
      - ${IDP_OUTPUT_ROOT:-../../data/output}:/output
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_WORKER_GPU:-0}"]
              capabilities: [gpu]

  vllm-vl:
    image: ${IDP_VLLM_VL_IMAGE:-local/vllm-vl:latest}
    pull_policy: never
    command:
      - --model
      - /models/vl
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen2.5-VL-32B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.95"
    environment:
      CUDA_VISIBLE_DEVICES: ${IDP_VLLM_VL_GPU:-0}
      HF_HOME: /models/vl/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU:-0}"]
              capabilities: [gpu]

  vllm-llm:
    image: ${IDP_VLLM_LLM_IMAGE:-local/vllm-llm:latest}
    pull_policy: never
    command:
      - --model
      - /models/llm
      - --served-model-name
      - ${IDP_LLM_MODEL:-Qwen3-14B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.95"
    environment:
      CUDA_VISIBLE_DEVICES: ${IDP_VLLM_LLM_GPU:-1}
      HF_HOME: /models/llm/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_LLM_GPU:-1}"]
              capabilities: [gpu]
