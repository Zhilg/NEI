[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "offline-pdf-batch-pipeline"
version = "0.1.0"
description = "Air-gapped PDF batch-processing pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<1.19",
  "minio>=7.2,<8",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<3.3",
  "sqlalchemy>=2.0,<2.1",
  "typer>=0.26,<0.27",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
idp = "idp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/idp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["idp"]
