name: idp

services:
  worker:
    image: ${IDP_APP_IMAGE:-local/idp-app:latest}
    pull_policy: never
    command: ["idp"]

    environment:
      PYTHONPATH: /workspace/src

      IDP_INPUT_ROOT: /input
      IDP_OUTPUT_ROOT: /output
      IDP_MODELS_ROOT: /models

      IDP_VL_ENDPOINTS: ${IDP_VL_ENDPOINTS:-http://vllm-vl-0:8000/v1,http://vllm-vl-1:8001/v1}
      IDP_VL_MODEL: ${IDP_VL_MODEL:-Qwen2.5-VL-32B-Instruct-AWQ}

      IDP_VL_CONCURRENCY: ${IDP_VL_CONCURRENCY:-8}

    volumes:
      - ${IDP_SOURCE_ROOT:-../..}:/workspace:ro
      - ${IDP_INPUT_ROOT:-../../data/input}:/input:ro
      - ${IDP_OUTPUT_ROOT:-../../data/output}:/output

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_WORKER_GPU:-0}"]
              capabilities: [gpu]

    depends_on:
      vllm-vl-0:
        condition: service_healthy
      vllm-vl-1:
        condition: service_healthy

  vllm-vl-0:
    image: ${IDP_VLLM_VL_IMAGE:-local/vllm-vl:latest}
    pull_policy: never
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU_0:-0}"]
              capabilities: [gpu]

    command:
      - --model
      - /models/vl
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen2.5-VL-32B-Instruct-AWQ}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --quantization
      - ${IDP_VLLM_QUANTIZATION:-awq}
      - --dtype
      - ${IDP_VLLM_DTYPE:-half}
      - --gpu-memory-utilization
      - ${IDP_VLLM_GPU_MEMORY_UTILIZATION:-0.9}
      - --max-model-len
      - ${IDP_VLLM_MAX_MODEL_LEN:-32768}
      - --trust-remote-code
      - --kv-cache-memory
      - ${IDP_VLLM_KV_CACHE_MEMORY:-15000000000}

    environment:
      CUDA_VISIBLE_DEVICES: ${IDP_VLLM_VL_GPU_0:-0}
      HF_HOME: /models/vl/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"

    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s

  vllm-vl-1:
    image: ${IDP_VLLM_VL_IMAGE:-local/vllm-vl:latest}
    pull_policy: never
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU_1:-1}"]
              capabilities: [gpu]

    command:
      - --model
      - /models/vl
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen2.5-VL-32B-Instruct-AWQ}
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --quantization
      - ${IDP_VLLM_QUANTIZATION:-awq}
      - --dtype
      - ${IDP_VLLM_DTYPE:-half}
      - --gpu-memory-utilization
      - ${IDP_VLLM_GPU_MEMORY_UTILIZATION:-0.9}
      - --max-model-len
      - ${IDP_VLLM_MAX_MODEL_LEN:-32768}
      - --trust-remote-code
      - --kv-cache-memory
      - ${IDP_VLLM_KV_CACHE_MEMORY:-15000000000}

    environment:
      CUDA_VISIBLE_DEVICES: ${IDP_VLLM_VL_GPU_1:-1}
      HF_HOME: /models/vl/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"

    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s

networks:
  idp_internal:
    internal: true
