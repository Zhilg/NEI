name: idp

# Общая конфигурация реплик vLLM; у сервисов отличаются только GPU
# и tensor-parallel-size.  Якорь живёт на верхнем уровне: ключи x-* под
# services: docker compose считает отдельными сервисами.
x-vllm-anchor: &vllm-base
  image: ${IDP_VLLM_VL_IMAGE:-local/vllm-vl:latest}
  pull_policy: never
  build:
    context: ${IDP_SOURCE_ROOT:-../../}
    dockerfile: infra/dockerfiles/vllm-vl/Dockerfile
  restart: unless-stopped
  environment:
    NVIDIA_DRIVER_CAPABILITIES: all
    IDP_VLLM_QUANTIZATION: ${IDP_VLLM_QUANTIZATION:-compressed-tensors}
    HF_HOME: /models/${IDP_VL_MODEL_DIR:-new_vl}/hf-cache
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    VLLM_NO_USAGE_STATS: "1"
    VLLM_IMAGE_MAX_PIXELS: "6000000"
    VLLM_IMAGE_MIN_PIXELS: "1003520"
    VLLM_ENABLE_CUDA_COMPATIBILITY: "1"
    OMP_NUM_THREADS: ${IDP_VLLM_OMP_NUM_THREADS:-1}
    VLLM_ENABLE_STARTUP_PLAN: ${IDP_VLLM_ENABLE_STARTUP_PLAN:-1}
    VLLM_CACHE_ROOT: ${IDP_VLLM_CACHE_ROOT:-/models/hf-cache}
  volumes:
    - ${IDP_MODELS_ROOT:-../../transfer/models}:/models
  healthcheck:
    test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=2)\""]
    interval: 15s
    timeout: 5s
    retries: 40
    start_period: 90s
  networks:
    - idp_internal

services:
  worker:
    image: ${IDP_APP_IMAGE:-local/idp-app:latest}
    pull_policy: never
    build:
      context: ${IDP_SOURCE_ROOT:-../../}
      dockerfile: Dockerfile
    # Наблюдатель: воркер не завершается после одного прогона, а сканирует
    # /input каждые IDP_WATCH_INTERVAL секунд и обрабатывает новые файлы.
    command: ["idp", "--watch"]
    restart: unless-stopped

    environment:
      PYTHONPATH: /workspace/src

      IDP_INPUT_ROOT: /input
      IDP_OUTPUT_ROOT: /output
      IDP_MODELS_ROOT: /models

      IDP_WATCH_INTERVAL: ${IDP_WATCH_INTERVAL:-5}
      IDP_WATCH_SETTLE: ${IDP_WATCH_SETTLE:-2}

      IDP_VL_ENDPOINTS: ${IDP_VL_ENDPOINTS:-http://vllm-vl:8000/v1,http://vllm-vl-2:8000/v1,http://vllm-vl-3:8000/v1,http://vllm-vl-4:8000/v1}
      IDP_VL_MODEL: ${IDP_VL_MODEL:-Qwen3.8-27B}
      IDP_VL_MAX_IMAGES: ${IDP_VL_MAX_IMAGES:-2}

      IDP_VL_TIMEOUT_SECONDS: ${IDP_VL_TIMEOUT_SECONDS:-600}
      IDP_VL_MAX_TOKENS: ${IDP_VL_MAX_TOKENS:-512}
      IDP_VL_MAX_CONTEXT_CHARS: ${IDP_VL_MAX_CONTEXT_CHARS:-500}
      IDP_VL_ENDPOINT: ${IDP_VL_ENDPOINT:-http://vllm-vl:8000/v1}

      # 32 параллельных запроса: ~8 на каждую из 4 реплик vLLM (round-robin)
      IDP_VL_CONCURRENCY: ${IDP_VL_CONCURRENCY:-32}

      IDP_TEST_MODE: ${IDP_TEST_MODE:-false}
      IDP_ARTIFACTS_MODE: ${IDP_ARTIFACTS_MODE:-false}

      IDP_RENDER_DPI: ${IDP_RENDER_DPI:-200}
      IDP_UPSCALE_FACTOR: ${IDP_UPSCALE_FACTOR:-1}
      IDP_MAX_IMAGE_DIMENSION: ${IDP_MAX_IMAGE_DIMENSION:-2048}

      IDP_VISIO_MODE: ${IDP_VISIO_MODE:-false}
      IDP_VISIO_CONTENT: ${IDP_VISIO_CONTENT:-pages}
      IDP_RECONSTRUCT_FORMATS: ${IDP_RECONSTRUCT_FORMATS:-docx,pdf}

      IDP_ENTITY_SCHEMA_PATH: ${IDP_ENTITY_SCHEMA_PATH:-}
      IDP_TRASH_PATH: ${IDP_TRASH_PATH:-}
      IDP_MIN_ENTITY_CONFIDENCE: ${IDP_MIN_ENTITY_CONFIDENCE:-0.3}
      IDP_FINETUNE_FEEDBACK_ENABLED: ${IDP_FINETUNE_FEEDBACK_ENABLED:-true}

    volumes:
      - ${IDP_SOURCE_ROOT:-../..}:/workspace
      - ${IDP_INPUT_ROOT:-../../data/input}:/input:ro
      - ${IDP_OUTPUT_ROOT:-../../data/output}:/output

    depends_on:
      vllm-vl:
        condition: service_healthy
      vllm-vl-2:
        condition: service_healthy
      vllm-vl-3:
        condition: service_healthy
      vllm-vl-4:
        condition: service_healthy

    networks:
      - idp_internal

  vllm-vl:
    <<: *vllm-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU_0:-0}", "${IDP_VLLM_VL_GPU_1:-1}"]
              capabilities: [gpu]

    command:
      - --model
      - /models/${IDP_VL_MODEL_DIR:-new_vl}
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen3.8-27B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "2"
      - --quantization
      - ${IDP_VLLM_QUANTIZATION:-compressed-tensors}
      - --dtype
      - half
      - --gpu-memory-utilization
      - ${IDP_VLLM_GPU_MEMORY_UTILIZATION:-0.5}
      - --max-model-len
      - ${IDP_VLLM_MAX_MODEL_LEN:-65536}
      - --kv-cache-dtype
      - ${IDP_VLLM_KV_CACHE_DTYPE:-fp8}
      - --max-num-seqs
      - ${IDP_VLLM_MAX_NUM_SEQS:-256}
      - --max-num-batched-tokens
      - ${IDP_VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
      - --limit-mm-per-prompt
      - '{"vision": 3}'
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --enable-prefix-caching
      - --async-scheduling
      - --attention-backend
      - ${IDP_VLLM_ATTENTION_BACKEND:-FLASHINFER}
      - --trust-remote-code
      - --kv-cache-memory
      - ${IDP_VLLM_KV_CACHE_MEMORY:-15000000000}

  # Реплики на свободных 80GB-картах: по одной на GPU, tensor-parallel-size 1.
  # Все слушают :8000 внутри своей сети — конфликтов нет, воркер ходит по
  # именам сервисов (vllm-vl-2/3/4) через IDP_VL_ENDPOINTS.
  vllm-vl-2:
    <<: *vllm-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU_2:-2}"]
              capabilities: [gpu]

    command:
      - --model
      - /models/${IDP_VL_MODEL_DIR:-new_vl}
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen3.8-27B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --quantization
      - ${IDP_VLLM_QUANTIZATION:-compressed-tensors}
      - --dtype
      - half
      - --gpu-memory-utilization
      - ${IDP_VLLM_GPU_MEMORY_UTILIZATION:-0.5}
      - --max-model-len
      - ${IDP_VLLM_MAX_MODEL_LEN:-65536}
      - --kv-cache-dtype
      - ${IDP_VLLM_KV_CACHE_DTYPE:-fp8}
      - --max-num-seqs
      - ${IDP_VLLM_MAX_NUM_SEQS:-256}
      - --max-num-batched-tokens
      - ${IDP_VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
      - --limit-mm-per-prompt
      - '{"vision": 3}'
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --enable-prefix-caching
      - --async-scheduling
      - --attention-backend
      - ${IDP_VLLM_ATTENTION_BACKEND:-FLASHINFER}
      - --trust-remote-code
      - --kv-cache-memory
      - ${IDP_VLLM_KV_CACHE_MEMORY:-15000000000}

  vllm-vl-3:
    <<: *vllm-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU_3:-3}"]
              capabilities: [gpu]

    command:
      - --model
      - /models/${IDP_VL_MODEL_DIR:-new_vl}
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen3.8-27B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --quantization
      - ${IDP_VLLM_QUANTIZATION:-compressed-tensors}
      - --dtype
      - half
      - --gpu-memory-utilization
      - ${IDP_VLLM_GPU_MEMORY_UTILIZATION:-0.5}
      - --max-model-len
      - ${IDP_VLLM_MAX_MODEL_LEN:-65536}
      - --kv-cache-dtype
      - ${IDP_VLLM_KV_CACHE_DTYPE:-fp8}
      - --max-num-seqs
      - ${IDP_VLLM_MAX_NUM_SEQS:-256}
      - --max-num-batched-tokens
      - ${IDP_VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
      - --limit-mm-per-prompt
      - '{"vision": 3}'
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --enable-prefix-caching
      - --async-scheduling
      - --attention-backend
      - ${IDP_VLLM_ATTENTION_BACKEND:-FLASHINFER}
      - --trust-remote-code
      - --kv-cache-memory
      - ${IDP_VLLM_KV_CACHE_MEMORY:-15000000000}

  vllm-vl-4:
    <<: *vllm-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU_4:-4}"]
              capabilities: [gpu]

    command:
      - --model
      - /models/${IDP_VL_MODEL_DIR:-new_vl}
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen3.8-27B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --quantization
      - ${IDP_VLLM_QUANTIZATION:-compressed-tensors}
      - --dtype
      - half
      - --gpu-memory-utilization
      - ${IDP_VLLM_GPU_MEMORY_UTILIZATION:-0.5}
      - --max-model-len
      - ${IDP_VLLM_MAX_MODEL_LEN:-65536}
      - --kv-cache-dtype
      - ${IDP_VLLM_KV_CACHE_DTYPE:-fp8}
      - --max-num-seqs
      - ${IDP_VLLM_MAX_NUM_SEQS:-256}
      - --max-num-batched-tokens
      - ${IDP_VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
      - --limit-mm-per-prompt
      - '{"vision": 3}'
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --enable-prefix-caching
      - --async-scheduling
      - --attention-backend
      - ${IDP_VLLM_ATTENTION_BACKEND:-FLASHINFER}
      - --trust-remote-code
      - --kv-cache-memory
      - ${IDP_VLLM_KV_CACHE_MEMORY:-15000000000}

  stub:
    image: ${IDP_APP_IMAGE:-local/idp-app:latest}
    pull_policy: never
    command: ["python", "-m", "tests.vlm_stub", "--host", "0.0.0.0", "--port", "8123", "--model", "stub-vl"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8123/v1/models', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    profiles:
      - stub
    networks:
      - idp_internal

networks:
  idp_internal:
