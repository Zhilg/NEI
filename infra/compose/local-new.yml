name: idp-new

services:
  worker:
    volumes:
      - ${IDP_SOURCE_ROOT:-../..}:/workspace:ro
      - ${IDP_INPUT_ROOT:-../../data/input}:/input:ro
      - ${IDP_OUTPUT_ROOT:-../../data/output}:/output
    environment:
      PYTHONPATH: /workspace/src
      IDP_INPUT_ROOT: /input
      IDP_OUTPUT_ROOT: /output
      IDP_MODELS_ROOT: /models
      IDP_VL_ENDPOINTS: ${IDP_VL_ENDPOINTS:-http://vllm-vl-0:8000/v1,http://vllm-vl-1:8001/v1}
      IDP_VL_MODEL: Qwen3.8-27B
      IDP_VL_CONCURRENCY: ${IDP_VL_CONCURRENCY:-8}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_WORKER_GPU:-0}"]
              capabilities: [gpu]
    depends_on:
      vllm-vl-0:
        condition: service_healthy
      vllm-vl-1:
        condition: service_healthy
    networks:
      idp_internal:
        aliases:
          - vllm-vl

  vllm-vl-0:
    command:
      - --model
      - /models/new_vl
      - --served-model-name
      - Qwen3.8-27B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --quantization
      - compressed-tensors
      - --dtype
      - half
      - --gpu-memory-utilization
      - ${IDP_VLLM_GPU_MEMORY_UTILIZATION:-0.5}
      - --max-model-len
      - ${IDP_VLLM_MAX_MODEL_LEN:-32678}
      - --limit-mm-per-prompt
      - '{"vision": 3}'
      - --trust-remote-code
      - --kv-cache-memory
      - ${IDP_VLLM_KV_CACHE_MEMORY:-15000000000}
      - --thinking
      - none
    image: ${IDP_VLLM_VL_IMAGE:-local/vllm-vl:latest}
    pull_policy: never
    build:
      context: ${IDP_SOURCE_ROOT:-../../}
      dockerfile: infra/dockerfiles/vllm-vl/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU_0:-0}"]
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      HF_HOME: /models/new_vl/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_IMAGE_MAX_PIXELS: "6000000"
      VLLM_IMAGE_MIN_PIXELS: "1003520"
      VLLM_ENABLE_CUDA_COMPATIBILITY: "1"
    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
    networks:
      idp_internal:
        aliases:
          - vllm-vl-0
          - vllm-vl

  vllm-vl-1:
    command:
      - --model
      - /models/new_vl
      - --served-model-name
      - Qwen3.8-27B
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --quantization
      - compressed-tensors
      - --dtype
      - half
      - --gpu-memory-utilization
      - ${IDP_VLLM_GPU_MEMORY_UTILIZATION:-0.5}
      - --max-model-len
      - ${IDP_VLLM_MAX_MODEL_LEN:-32678}
      - --limit-mm-per-prompt
      - '{"vision": 3}'
      - --trust-remote-code
      - --kv-cache-memory
      - ${IDP_VLLM_KV_CACHE_MEMORY:-15000000000}
      - --thinking
      - none
    image: ${IDP_VLLM_VL_IMAGE:-local/vllm-vl:latest}
    pull_policy: never
    build:
      context: ${IDP_SOURCE_ROOT:-../../}
      dockerfile: infra/dockerfiles/vllm-vl/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU_1:-1}"]
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      HF_HOME: /models/new_vl/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_IMAGE_MAX_PIXELS: "6000000"
      VLLM_IMAGE_MIN_PIXELS: "1003520"
      VLLM_ENABLE_CUDA_COMPATIBILITY: "1"
    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
    networks:
      idp_internal:
        aliases:
          - vllm-vl-1
          - vllm-vl

networks:
  idp_internal:
    internal: true
