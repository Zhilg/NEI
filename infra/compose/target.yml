services:
  # Images are loaded from a verified release bundle before this profile is started.
  # The internal network intentionally denies internet egress at runtime.
  postgres:
    image: ${IDP_POSTGRES_IMAGE:?Set immutable offline image digest}
    environment:
      POSTGRES_DB: ${IDP_POSTGRES_DB:-idp}
      POSTGRES_USER: ${IDP_POSTGRES_USER:-idp}
      POSTGRES_PASSWORD: ${IDP_POSTGRES_PASSWORD:?Set from target secret store}
    networks: [idp_internal]

  minio:
    image: ${IDP_MINIO_IMAGE:?Set immutable offline image digest}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${IDP_MINIO_ROOT_USER:?Set from target secret store}
      MINIO_ROOT_PASSWORD: ${IDP_MINIO_ROOT_PASSWORD:?Set from target secret store}
    networks: [idp_internal]
    volumes:
      - ${IDP_MINIO_DATA_ROOT:-/var/lib/idp/minio}:/data

  minio-init:
    image: ${IDP_MINIO_MC_IMAGE:?Set immutable offline image digest}
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      until mc alias set local http://minio:9000 ${IDP_MINIO_ROOT_USER} ${IDP_MINIO_ROOT_PASSWORD};
      do sleep 1; done;
      mc mb --ignore-existing local/idp-artifacts
    depends_on: [minio]
    networks: [idp_internal]
    read_only: true
    tmpfs:
      - /tmp

  migrate:
    image: ${IDP_CONTROLLER_IMAGE:?Set immutable offline image digest}
    command: ["alembic", "upgrade", "head"]
    environment:
      IDP_DATABASE_URL: postgresql+psycopg://${IDP_POSTGRES_USER:-idp}:${IDP_POSTGRES_PASSWORD}@postgres:5432/${IDP_POSTGRES_DB:-idp}
      IDP_OFFLINE_MODE: "true"
      IDP_TELEMETRY_ENABLED: "false"
    depends_on: [postgres]
    networks: [idp_internal]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${IDP_RELEASE_ROOT:-/var/lib/idp}:/var/lib/idp:ro
      - ${IDP_RELEASE_PUBLIC_KEY:-/etc/idp/release-public.pem}:/etc/idp/release-public.pem:ro

  controller:
    image: ${IDP_CONTROLLER_IMAGE:?Set immutable offline image digest}
    command: ["idp", "controller", "run"]
    environment:
      IDP_DATABASE_URL: postgresql+psycopg://${IDP_POSTGRES_USER:-idp}:${IDP_POSTGRES_PASSWORD}@postgres:5432/${IDP_POSTGRES_DB:-idp}
      IDP_MINIO_ACCESS_KEY: ${IDP_MINIO_ROOT_USER}
      IDP_MINIO_SECRET_KEY: ${IDP_MINIO_ROOT_PASSWORD}
      IDP_MINIO_ENDPOINT: minio:9000
      IDP_OFFLINE_MODE: "true"
      IDP_TELEMETRY_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks: [idp_internal]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${IDP_RELEASE_ROOT:-/var/lib/idp}:/var/lib/idp:ro
      - ${IDP_RELEASE_PUBLIC_KEY:-/etc/idp/release-public.pem}:/etc/idp/release-public.pem:ro

  worker:
    image: ${IDP_CONTROLLER_IMAGE:?Set immutable offline image digest}
    command: ["idp", "worker", "run"]
    environment:
      IDP_DATABASE_URL: postgresql+psycopg://${IDP_POSTGRES_USER:-idp}:${IDP_POSTGRES_PASSWORD}@postgres:5432/${IDP_POSTGRES_DB:-idp}
      IDP_MINIO_ACCESS_KEY: ${IDP_MINIO_ROOT_USER}
      IDP_MINIO_SECRET_KEY: ${IDP_MINIO_ROOT_PASSWORD}
      IDP_MINIO_ENDPOINT: minio:9000
      IDP_OFFLINE_MODE: "true"
      IDP_TELEMETRY_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      IDP_MINERU_COMMAND: ${IDP_MINERU_COMMAND:?Set pinned MinerU command JSON}
      IDP_OCR_DETECTOR_COMMAND: ${IDP_OCR_DETECTOR_COMMAND:?Set pinned detector command JSON}
      IDP_OCR_ROUTER_COMMAND: ${IDP_OCR_ROUTER_COMMAND:?Set pinned router command JSON}
      IDP_OCR_EAST_SLAVIC_COMMAND: ${IDP_OCR_EAST_SLAVIC_COMMAND:?Set pinned East-Slavic recognizer command JSON}
      IDP_OCR_CYRILLIC_COMMAND: ${IDP_OCR_CYRILLIC_COMMAND:?Set pinned Cyrillic recognizer command JSON}
      IDP_OCR_LATIN_CJK_COMMAND: ${IDP_OCR_LATIN_CJK_COMMAND:?Set pinned Latin/CJK recognizer command JSON}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      qwen-vl:
        condition: service_healthy
      qwen3:
        condition: service_healthy
    networks: [idp_internal]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${IDP_RELEASE_ROOT:-/var/lib/idp}:/var/lib/idp:ro
      - ${IDP_RELEASE_PUBLIC_KEY:-/etc/idp/release-public.pem}:/etc/idp/release-public.pem:ro

  qwen-vl:
    image: ${IDP_QWEN_VL_IMAGE:?Set immutable offline image digest}
    command: ${IDP_QWEN_VL_COMMAND:?Set pinned local vLLM launch command}
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      HF_HOME: /models/qwen-vl/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
    networks: [idp_internal]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${IDP_MODEL_ROOT:?Set release-verified model root}:/models:ro
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/v1/models\", timeout=2)' "]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  qwen3:
    image: ${IDP_QWEN3_IMAGE:?Set immutable offline image digest}
    command: ${IDP_QWEN3_COMMAND:?Set pinned local Qwen3/Fenic vLLM launch command}
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      HF_HOME: /models/qwen3/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
    networks: [idp_internal]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${IDP_MODEL_ROOT:?Set release-verified model root}:/models:ro
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/v1/models\", timeout=2)' "]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

networks:
  idp_internal:
    internal: true
