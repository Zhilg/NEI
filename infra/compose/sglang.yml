name: idp-sglang

services:
  vllm-vl-0:
    image: ${IDP_SGLANG_IMAGE:-lmsysorg/sglang:latest}
    command:
      - python
      - -m
      - sglang.launch_server
      - --model-path
      - /models/new_vl
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen3.8-27B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --quantization
      - compressed-tensors
      - --dtype
      - half
      - --mem-fraction-static
      - ${IDP_SGLANG_MEM_FRACTION:-0.5}
      - --context-length
      - ${IDP_VLLM_MAX_MODEL_LEN:-32678}
      - --trust-remote-code
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      HF_HOME: /models/new_vl/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s

  vllm-vl-1:
    image: ${IDP_SGLANG_IMAGE:-lmsysorg/sglang:latest}
    command:
      - python
      - -m
      - sglang.launch_server
      - --model-path
      - /models/new_vl
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen3.8-27B}
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --quantization
      - compressed-tensors
      - --dtype
      - half
      - --mem-fraction-static
      - ${IDP_SGLANG_MEM_FRACTION:-0.5}
      - --context-length
      - ${IDP_VLLM_MAX_MODEL_LEN:-32678}
      - --trust-remote-code
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      HF_HOME: /models/new_vl/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
