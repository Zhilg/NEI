name: idp-sglang

services:
  worker:
    image: ${IDP_APP_IMAGE:-local/idp-app:latest}
    pull_policy: never
    build:
      context: ${IDP_SOURCE_ROOT:-../../}
      dockerfile: Dockerfile
    command: ["idp"]

    environment:
      PYTHONPATH: /workspace/src
      IDP_INPUT_ROOT: /input
      IDP_OUTPUT_ROOT: /output
      IDP_MODELS_ROOT: /models
      IDP_VL_ENDPOINTS: ${IDP_VL_ENDPOINTS:-http://sglang-vl-0:30000/v1,http://sglang-vl-1:30001/v1}
      IDP_VL_MODEL: ${IDP_VL_MODEL:-Qwen3.8-27B}
      IDP_VL_CONCURRENCY: ${IDP_VL_CONCURRENCY:-8}

    volumes:
      - ${IDP_SOURCE_ROOT:-../..}:/workspace:ro
      - ${IDP_INPUT_ROOT:-../../data/input}:/input:ro
      - ${IDP_OUTPUT_ROOT:-../../data/output}:/output

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_WORKER_GPU:-0}"]
              capabilities: [gpu]

    depends_on:
      sglang-vl-0:
        condition: service_healthy
      sglang-vl-1:
        condition: service_healthy

    networks:
      idp_internal:
        aliases:
          - sglang-vl

  sglang-vl-0:
    image: ${IDP_SGLANG_IMAGE:-sglang/sglang:latest}
    command:
      - python
      - -m
      - sglang.launch_server
      - --model-path
      - /models/new_vl
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen3.8-27B}
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --quantization
      - compressed-tensors
      - --dtype
      - half
      - --mem-fraction-static
      - ${IDP_SGLANG_MEM_FRACTION:-0.5}
      - --context-length
      - ${IDP_VLLM_MAX_MODEL_LEN:-32678}
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU_0:-0}"]
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      HF_HOME: /models/new_vl/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:30000/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
    networks:
      idp_internal:
        aliases:
          - sglang-vl-0
          - sglang-vl

  sglang-vl-1:
    image: ${IDP_SGLANG_IMAGE:-sglang/sglang:latest}
    command:
      - python
      - -m
      - sglang.launch_server
      - --model-path
      - /models/new_vl
      - --served-model-name
      - ${IDP_VL_MODEL:-Qwen3.8-27B}
      - --host
      - 0.0.0.0
      - --port
      - "30001"
      - --quantization
      - compressed-tensors
      - --dtype
      - half
      - --mem-fraction-static
      - ${IDP_SGLANG_MEM_FRACTION:-0.5}
      - --context-length
      - ${IDP_VLLM_MAX_MODEL_LEN:-32678}
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IDP_VLLM_VL_GPU_1:-1}"]
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      HF_HOME: /models/new_vl/hf-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ${IDP_MODELS_ROOT:-../../transfer/models}:/models
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:30001/v1/models', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
    networks:
      idp_internal:
        aliases:
          - sglang-vl-1
          - sglang-vl

networks:
  idp_internal:
    internal: true
